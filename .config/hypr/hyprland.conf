# hyprland config — VT4
# Shared session services (kanshi, swaybg, swayidle, waybar, clipman) are
# started by wayland.target via hyprland-session.target.

monitor = , preferred, auto, 1

env = XCURSOR_THEME, Breeze_Hacked
env = XCURSOR_SIZE, 24

general {
    gaps_in = 10
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(00BCD4ff)
    col.inactive_border = rgba(444444ff)
    layout = dwindle
}

decoration {
    active_opacity = 0.9
    inactive_opacity = 0.9
    blur {
        enabled = true
        size = 10
        passes = 2
    }
    shadow {
        enabled = true
        range = 10
        render_power = 3
    }
}

input {
    kb_layout = us,de
    repeat_rate = 25
    repeat_delay = 200
    touchpad {
        tap-to-click = true
        drag_lock = false
        natural_scroll = false
        clickfinger_behavior = true
        disable_while_typing = false
    }
    accel_profile = flat
    sensitivity = 0.0
}

cursor {
    inactive_timeout = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = false
}

dwindle {
    preserve_split = true
}

# ── Window Rules ──────────────────────────────────────────────────────────────
windowrule = float on, match:class ^(jetbrains-toolbox)$
windowrule = float on, match:class ^(steam_app_.*)$
windowrule = float on, match:class ^(steamwebhelper)$
windowrule = float on, match:class ^(sun-awt-X11-XWindowPeer)$
windowrule = float on, match:class ^(java-lang-Thread)$
windowrule = float on, match:class ^(Gnome-network-displays)$
windowrule = float on, match:class ^(gnome-network-displays)$
windowrule = float on, match:class ^(AusweisApp)$
windowrule = float on, match:title ^(AusweisApp)$
windowrule = float on, match:class ^(Kazam)$
windowrule = float on, match:class ^(jetbrains-.*)$, match:title ^(win0|Welcome to IntelliJ IDEA|splash|Get from Version Control|Clone Repository)$
windowrule = tile on, match:class ^(jetbrains-.*)$, match:title ^(Debug)$
windowrule = pin on, match:title .*sharing your screen.*
windowrule = border_size 0, match:title .*sharing your screen.*
windowrule = opacity 0.5 0.5, match:class ^(youtube-music-desktop-app)$
windowrule = opacity 0.5 0.5, match:class ^(ytm)$

# ── Workspace Assignments ─────────────────────────────────────────────────────
windowrule = workspace 1 silent, match:class ^(thunderbird)$
windowrule = workspace 1 silent, match:class ^(Thunderbird)$
windowrule = workspace 1 silent, match:class ^(work)$
windowrule = workspace 1 silent, match:class ^(work-todo)$
windowrule = workspace 1 silent, match:class ^(telefondienst)$
windowrule = workspace 1 silent, match:class ^(daily)$
windowrule = workspace 1 silent, match:class ^(org.gabmus.gfeeds)$
windowrule = workspace 1 silent, match:class ^(stuff)$, match:title ^(_GMail)$
windowrule = workspace 14 silent, match:class ^(discord)$
windowrule = workspace 14 silent, match:class ^(vesktop)$
windowrule = workspace 15 silent, match:class ^(steam)$
windowrule = workspace 15 silent, match:class ^(Steam)$
windowrule = workspace 16 silent, match:class ^(stuff)$, match:title ^(_YouTube)$
windowrule = workspace 17 silent, match:class ^(stuff)$, match:title ^(_Netflix.*)$
windowrule = workspace 17 silent, match:class ^(stuff)$, match:title ^(_Anime.*)$
windowrule = workspace 18 silent, match:class ^(youtube-music-desktop-app)$
windowrule = workspace 18 silent, match:class ^(ytm)$
windowrule = workspace 19 silent, match:class ^(Rocket.Chat)$
windowrule = workspace 19 silent, match:class ^(rocketchat)$
windowrule = workspace 19 silent, match:class ^(meeting)$
windowrule = workspace 19 silent, match:class ^(work-slack)$
windowrule = workspace 20 silent, match:class ^(Slack)$
windowrule = workspace 20 silent, match:class ^(slack)$
windowrule = workspace 20 silent, match:class ^(Signal)$
windowrule = workspace 20 silent, match:class ^(signal)$
windowrule = workspace 20 silent, match:class ^(TelegramDesktop)$
windowrule = workspace 20 silent, match:class ^(org.telegram.desktop)$
windowrule = workspace 20 silent, match:class ^(whatsapp)$

# ── Output / Workspace Preferences ───────────────────────────────────────────
workspace = 1,  monitor:HDMI-A-1, default:true
workspace = 14, monitor:eDP-1
workspace = 15, monitor:HDMI-A-1, default:true
workspace = 16, monitor:HDMI-A-1, default:true
workspace = 17, monitor:HDMI-A-1, default:true
workspace = 18, monitor:eDP-1
workspace = 19, monitor:eDP-1
workspace = 20, monitor:eDP-1

# ── Keybindings — Window Management ──────────────────────────────────────────
bind = SUPER, Return, exec, terminal
bind = SUPER SHIFT, Q, killactive,
bind = ALT, F4, exec, true

bind = SUPER, Left,  movefocus, l
bind = SUPER, Down,  movefocus, d
bind = SUPER, Up,    movefocus, u
bind = SUPER, Right, movefocus, r

bind = SUPER SHIFT, Left,  movewindow, l
bind = SUPER SHIFT, Down,  movewindow, d
bind = SUPER SHIFT, Up,    movewindow, u
bind = SUPER SHIFT, Right, movewindow, r

bind = SUPER, H, togglesplit,
bind = SUPER, V, togglesplit,
bind = SUPER, F, fullscreen, 0
bind = SUPER, T, pseudo,
bind = SUPER, E, togglesplit,
bind = SUPER SHIFT, SPACE, togglefloating,
bind = SUPER SHIFT, R, exec, hyprctl reload

# ── Mouse ─────────────────────────────────────────────────────────────────────
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ── Resize Submap ─────────────────────────────────────────────────────────────
bind = SUPER, R, submap, resize
submap = resize
binde = , Left,      resizeactive, -50 0
binde = , Right,     resizeactive,  50 0
binde = , Up,        resizeactive,  0 -50
binde = , Down,      resizeactive,  0  50
binde = , j,         resizeactive, -50 0
binde = , k,         resizeactive,  0  50
binde = , l,         resizeactive,  0 -50
binde = , semicolon, resizeactive,  50 0
bind  = , Escape, submap, reset
bind  = , Return, submap, reset
submap = reset

# ── Power Submap ──────────────────────────────────────────────────────────────
bind = SUPER, Q, submap, power
submap = power
bind = , S, exec, loginctl lock-session && sleep 1 && systemctl suspend
bind = , S, submap, reset
bind = , P, exec, systemctl poweroff
bind = , R, exec, systemctl reboot
bind = , L, exit,
bind = , Escape, submap, reset
submap = reset

# ── App Launchers ─────────────────────────────────────────────────────────────
bind = SUPER, D, exec, timeout 10 rofi -show drun
bind = SUPER, C, exec, browser
bind = SUPER SHIFT, C, exec, browser --incognito
bind = SUPER, M, exec, systemctl --user restart browser@meeting.service
bind = SUPER SHIFT, M, exec, systemctl --user stop browser@meeting.service browser@daily.service
bind = SUPER, P, exec, timeout 30 open_project
bind = SUPER, G, exec, sh -c 'timeout 120 rofi -show calc -location 2 -automatic-save-to-history -no-fixed-num-lines -no-show-match -no-sort -calc-command "echo -n {result} | wl-copy"'

# ── Notifications ─────────────────────────────────────────────────────────────
bind = CTRL, SPACE, exec, dunstctl close
bind = CTRL, grave, exec, dunstctl history-pop
bind = CTRL SHIFT, period, exec, dunstctl context

# ── Audio ─────────────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% && pactl set-sink-mute @DEFAULT_SINK@ 0
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = SHIFT, XF86AudioMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = SUPER CTRL SHIFT, O, exec, audio_program_volume
bind = SUPER SHIFT, O, exec, audio_program_sink
bind = SUPER CTRL, O, exec, audio_profile
bind = SUPER, O, exec, audio_sink

# ── Brightness ────────────────────────────────────────────────────────────────
bindel = , XF86MonBrightnessUp, exec, brightness up
bindel = , XF86MonBrightnessDown, exec, brightness down

# ── Media ─────────────────────────────────────────────────────────────────────
bind = , XF86AudioPlay, exec, pctl play-pause
bind = SHIFT, XF86AudioPlay, exec, pctl NEXT
bind = , XF86AudioPause, exec, pctl pause
bind = , XF86AudioNext, exec, pctl next
bind = SHIFT, XF86AudioNext, exec, pctl position 5+
bind = , XF86AudioPrev, exec, pctl previous
bind = SHIFT, XF86AudioPrev, exec, pctl position 5-
bind = , code:164, exec, pctl play-pause
bind = , mouse:276, exec, pctl next
bind = SHIFT, mouse:276, exec, pctl position 5+
bind = SHIFT, mouse:275, exec, pctl position 5-

# ── Display / Connectivity ────────────────────────────────────────────────────
bind = SUPER SHIFT, P, exec, timeout 30 rofi-randr
bind = SUPER CTRL, P, exec, timeout 30 autorandr_dmenu
bind = , XF86Display, exec, timeout 30 autorandr_dmenu
bind = SHIFT, XF86Display, exec, timeout 30 rofi-randr
bind = SUPER, B, exec, timeout 10 bluetooth_dmenu
bind = SUPER, I, exec, timeout 30 networkmanager_dmenu -i
bind = SUPER, U, exec, timeout 10 udiskie-dmenu

# ── Lock ──────────────────────────────────────────────────────────────────────
bind = SUPER, L, exec, loginctl lock-session

# ── Keyboard Layout ───────────────────────────────────────────────────────────
bind = SUPER, K, exec, hyprctl switchxkblayout all next

# ── Emoji ─────────────────────────────────────────────────────────────────────
bind = SUPER, period, exec, sh -c 'timeout 30 bemoji -c -n && ydotool key 29:1 42:1 47:1 47:0 42:0 29:0'

# ── Force-kill (key release) ──────────────────────────────────────────────────
bindr = SUPER, X, killactive,

# ── Clipboard ─────────────────────────────────────────────────────────────────
bind = SUPER CTRL, V, exec, sh -c 'clipman pick -t rofi -T"-i" --err-on-no-selection && wtype "$(wl-paste)"'
bind = SUPER SHIFT, V, exec, sh -c 'clipman pick -t rofi -T"-i" --err-on-no-selection && ydotool key 29:1 42:1 47:1 47:0 42:0 29:0'

# ── Screenshots (key release) ─────────────────────────────────────────────────
bindr = , Print, exec, screenshot selection clipboard
bindr = SHIFT, Print, exec, screenshot full clipboard
bindr = SUPER SHIFT, Print, exec, screenshot window clipboard
bindr = CTRL, Print, exec, screenshot selection --
bindr = CTRL SHIFT, Print, exec, screenshot full --
bindr = CTRL SHIFT SUPER, Print, exec, screenshot window --
bindr = SUPER, Print, exec, screenshot screen-replay

# ── Scratchpad ────────────────────────────────────────────────────────────────
bind = SUPER SHIFT, U, togglespecialworkspace,

# ── Waybar Toggle ─────────────────────────────────────────────────────────────
bind = SUPER SHIFT, F, exec, sh -c 'if systemctl --user -q is-active waybar; then systemctl --user stop waybar; else systemctl --user start waybar; fi'

# ── Workspace Navigation ──────────────────────────────────────────────────────
bind = SUPER, Page_Up, workspace, e-1
bind = SUPER, Page_Down, workspace, e+1

# ── Monitor Focus / Move ──────────────────────────────────────────────────────
bind = SUPER CTRL, Left,  focusmonitor, l
bind = SUPER CTRL, Right, focusmonitor, r
bind = SUPER CTRL, Up,    focusmonitor, u
bind = SUPER CTRL, Down,  focusmonitor, d
bind = SUPER CTRL SHIFT, Left,  movewindow, mon:l
bind = SUPER CTRL SHIFT, Right, movewindow, mon:r
bind = SUPER CTRL SHIFT, Up,    movewindow, mon:u
bind = SUPER CTRL SHIFT, Down,  movewindow, mon:d

# ── Workspace Switching ───────────────────────────────────────────────────────
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, 1, workspace, 11
bind = SUPER ALT, 2, workspace, 12
bind = SUPER ALT, 3, workspace, 13
bind = SUPER ALT, 4, workspace, 14
bind = SUPER ALT, 5, workspace, 15
bind = SUPER ALT, 6, workspace, 16
bind = SUPER ALT, 7, workspace, 17
bind = SUPER ALT, 8, workspace, 18
bind = SUPER ALT, 9, workspace, 19
bind = SUPER ALT, 0, workspace, 20

# ── Move Container to Workspace ───────────────────────────────────────────────
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER SHIFT ALT, 1, movetoworkspace, 11
bind = SUPER SHIFT ALT, 2, movetoworkspace, 12
bind = SUPER SHIFT ALT, 3, movetoworkspace, 13
bind = SUPER SHIFT ALT, 4, movetoworkspace, 14
bind = SUPER SHIFT ALT, 5, movetoworkspace, 15
bind = SUPER SHIFT ALT, 6, movetoworkspace, 16
bind = SUPER SHIFT ALT, 7, movetoworkspace, 17
bind = SUPER SHIFT ALT, 8, movetoworkspace, 18
bind = SUPER SHIFT ALT, 9, movetoworkspace, 19
bind = SUPER SHIFT ALT, 0, movetoworkspace, 20

# ── Session Startup ───────────────────────────────────────────────────────────
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE DISPLAY && systemctl --user start hyprland-session.target
