# MangoWC tag rules — window-to-tag assignments and floating rules
#
# Tag mapping:
#   1 = Work (mail, work browsers, todo, telefondienst, daily, gfeeds)
#   2 = Development
#   3 = General
#   4 = Media + Music (YouTube, Netflix, YMP)
#   5 = Gaming (Steam)
#   6 = Free / scratch
#   7 = Work Chat (RocketChat, meeting, work-slack)
#   8 = Personal Chat (Slack, Signal, Telegram, WhatsApp)
#   9 = Discord

# ═══════════════════════════════════════════
# Tag assignments
# ═══════════════════════════════════════════

# Tag 1: Work
windowrule=tags:1,appid:thunderbird
windowrule=tags:1,appid:work
windowrule=tags:1,appid:work-todo
windowrule=tags:1,appid:telefondienst
windowrule=tags:1,appid:daily
windowrule=tags:1,appid:org.gabmus.gfeeds
windowrule=tags:1,appid:stuff,title:^_GMail$
# XWayland fallback (class-based matching)
windowrule=tags:1,title:^Thunderbird$

# Tag 4: Media + Music
windowrule=tags:4,appid:stuff,title:^_YouTube$
windowrule=tags:4,appid:stuff,title:^_Netflix \d+$
windowrule=tags:4,appid:stuff,title:^_Anime \d+$
windowrule=tags:4,appid:youtube-music-desktop-app
windowrule=tags:4,appid:ytm
# YMP special opacity
windowrule=focused_opacity:0.5,unfocused_opacity:0.5,appid:youtube-music-desktop-app
windowrule=focused_opacity:0.5,unfocused_opacity:0.5,appid:ytm

# Tag 5: Gaming
windowrule=tags:5,appid:^steam$
windowrule=tags:5,title:^Steam$
windowrule=tags:5,appid:stuff,title:^_Steam \d+$
windowrule=tags:5,appid:^/usr/libexec/chimera/chimera-splash$

# Tag 7: Work Chat
windowrule=tags:7,appid:Rocket.Chat
windowrule=tags:7,appid:rocketchat
windowrule=tags:7,appid:meeting
windowrule=tags:7,appid:work-slack

# Tag 8: Personal Chat
windowrule=tags:8,appid:Slack
windowrule=tags:8,appid:slack
windowrule=tags:8,appid:Signal
windowrule=tags:8,appid:signal
windowrule=tags:8,appid:TelegramDesktop
windowrule=tags:8,appid:org.telegram.desktop
windowrule=tags:8,appid:whatsapp

# Tag 9: Discord
windowrule=tags:9,appid:discord
windowrule=tags:9,appid:vesktop

# ═══════════════════════════════════════════
# Floating rules
# ═══════════════════════════════════════════

# Steam game windows
windowrule=isfloating:1,appid:steam_app.*
windowrule=isfloating:1,appid:steam_proton

# Steam webhelper popups (not Friends List or main Steam window)
windowrule=isfloating:1,appid:steamwebhelper,title:^(?!Friends List)(?!Steam).*

# JetBrains IDE popups
windowrule=isfloating:1,appid:jetbrains-toolbox
windowrule=isfloating:1,appid:jetbrains-.*,title:Clone Repository
windowrule=isfloating:1,appid:jetbrains-.*,title:win0
windowrule=isfloating:1,appid:jetbrains-.*,title:Welcome to IntelliJ IDEA
windowrule=isfloating:1,appid:jetbrains-.*,title:splash
windowrule=isfloating:1,appid:jetbrains-.*,title:Get from Version Control
# JetBrains debug should NOT float
windowrule=isfloating:0,appid:jetbrains-.*,title:Debug

# Java windows
windowrule=isfloating:1,appid:sun-awt-X11-XWindowPeer
windowrule=isfloating:1,appid:java-lang-Thread

# Java iKVM Viewer — force tiled, no focus steal
windowrule=isfloating:0,force_tiled_state:1,title:Java iKVM Viewer.*

# Other floating
windowrule=isfloating:1,appid:Gnome-network-displays
windowrule=isfloating:1,appid:gnome-network-displays
windowrule=isfloating:1,title:ALVR dashboard
windowrule=isfloating:1,appid:kdeconnect.daemon
windowrule=isfloating:1,appid:kdeconnect-daemon
windowrule=isfloating:1,appid:AusweisApp
windowrule=isfloating:1,title:AusweisApp
windowrule=isfloating:1,no_force_center:0,appid:oidc
# TODO: OIDC auto-close after auth redirect — MangoWC lacks i3's for_window kill

# Screen sharing indicator — no border, no blur, sticky (visible on all tags)
windowrule=isnoborder:1,noblur:1,isglobal:1,title:.*is sharing your screen.*

# Terminal swallowing
windowrule=isterm:1,appid:com.mitchellh.ghostty
windowrule=isterm:1,appid:ghostty

# ═══════════════════════════════════════════
# Per-tag layout defaults
# ═══════════════════════════════════════════

tagrule=id:1,layout_name:tile,mfact:0.55
tagrule=id:2,layout_name:tile,mfact:0.55
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:monocle
tagrule=id:5,layout_name:monocle
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile,mfact:0.65
tagrule=id:8,layout_name:tile,mfact:0.65
tagrule=id:9,layout_name:monocle
