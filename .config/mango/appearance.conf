# MangoWC appearance — replaces picom

# Gaps (matching i3: outer 5, inner 10)
gappih=10
gappiv=10
gappoh=5
gappov=5

# Borders
borderpx=1

# Colors (0xRRGGBBAA)
rootcolor=0x000000ff
bordercolor=0x444444ff
focuscolor=0x00BCD4ff
urgentcolor=0xe53935ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff

# Opacity (matching picom: active 0.9, inactive 0.8)
focused_opacity=0.9
unfocused_opacity=0.8

# Blur (matching picom: dual_kawase, strength 10)
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius=10
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Shadows
shadows=1
shadow_only_floating=0
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x00000088

# Corner radius (matching picom: 0)
border_radius=0

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.5
zoom_initial_ratio=0.5
zoom_end_ratio=0.9
animation_duration_move=400
animation_duration_open=300
animation_duration_tag=250
animation_duration_close=250
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99
animation_curve_close=0.46,1.0,0.29,0.99
tag_animation_direction=1

# Layer rules
layerrule=layer_name:waybar,noblur:1,noshadow:1
layerrule=layer_name:rofi,animation_type_open:zoom,animation_type_close:zoom
layerrule=layer_name:notifications,noshadow:1
