# MangoWC keybindings — translated from i3 config
# Format: bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS

# ═══════════════════════════════════════════
# Window Management
# ═══════════════════════════════════════════

# Terminal
bind=SUPER,Return,spawn,terminal

# Kill focused window
bind=SUPER+SHIFT,q,killclient

# Prevent alt+F4 from reaching apps
bind=ALT,F4,spawn,true

# Focus direction
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move window direction
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# Focus stack (cycle through windows)
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev

# Swap focused with master
bind=SUPER,h,zoom

# Fullscreen
bind=SUPER,f,togglefullscreen

# Layout switching (cycle through tile/monocle/grid)
bind=SUPER,t,switch_layout
bind=SUPER,e,setlayout,tile

# Toggle floating
bind=SUPER+SHIFT,space,togglefloating

# Master area adjustment
bind=SUPER,bracketright,setmfact,+0.05
bind=SUPER,bracketleft,setmfact,-0.05
bind=SUPER+SHIFT,bracketright,incnmaster,+1
bind=SUPER+SHIFT,bracketleft,incnmaster,-1

# Reload config
bind=SUPER+SHIFT,r,reload_config

# Scratchpad
bind=SUPER+SHIFT,u,toggle_scratchpad

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ═══════════════════════════════════════════
# Resize Mode
# ═══════════════════════════════════════════

keymode=resize
bind=NONE,Left,resizewin,-50,+0
bind=NONE,Right,resizewin,+50,+0
bind=NONE,Up,resizewin,+0,-50
bind=NONE,Down,resizewin,+0,+50
# j/k/l/; for vim-style resize
bind=NONE,j,resizewin,-50,+0
bind=NONE,k,resizewin,+0,+50
bind=NONE,l,resizewin,+0,-50
bind=NONE,semicolon,resizewin,+50,+0
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

keymode=default
bind=SUPER,r,setkeymode,resize

# ═══════════════════════════════════════════
# Power Mode
# ═══════════════════════════════════════════

keymode=power
bind=NONE,s,spawn_shell,mmsg -s -d setkeymode,default && loginctl lock-session && sleep 1 && mmsg -s -d disable_monitor,*
bind=NONE,p,spawn,systemctl poweroff
bind=NONE,r,spawn,systemctl reboot
bind=NONE,l,spawn,mmsg -q
bind=NONE,Escape,setkeymode,default

keymode=default
bind=SUPER,q,setkeymode,power

# ═══════════════════════════════════════════
# Application Launchers
# ═══════════════════════════════════════════

bind=SUPER,d,spawn_shell,timeout 10 rofi -show drun
bind=SUPER,c,spawn,browser
bind=SUPER+SHIFT,c,spawn,browser --incognito
bind=SUPER,m,spawn_shell,systemctl --user restart browser@meeting.service
bind=SUPER+SHIFT,m,spawn_shell,systemctl --user stop browser@meeting.service browser@daily.service
bind=SUPER,p,spawn_shell,timeout 30 open_project
bind=SUPER,g,spawn_shell,timeout 120 rofi -show calc -location 2 -automatic-save-to-history -no-fixed-num-lines -no-show-match -no-sort -calc-command "echo -n '{result}' | wl-copy"

# ═══════════════════════════════════════════
# Notifications (dunst)
# ═══════════════════════════════════════════

bind=CTRL,space,spawn,dunstctl close
bind=CTRL,grave,spawn,dunstctl history-pop
bind=CTRL+SHIFT,period,spawn,dunstctl context

# ═══════════════════════════════════════════
# Audio Controls (PulseAudio/PipeWire)
# ═══════════════════════════════════════════

bind=NONE,XF86AudioRaiseVolume,spawn_shell,pactl set-sink-volume @DEFAULT_SINK@ +5% && pactl set-sink-mute @DEFAULT_SINK@ 0
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Audio settings (rofi menus)
bind=SUPER+CTRL+SHIFT,o,spawn,audio_program_volume
bind=SUPER+SHIFT,o,spawn,audio_program_sink
bind=SUPER+CTRL,o,spawn,audio_profile
bind=SUPER,o,spawn,audio_sink

# ═══════════════════════════════════════════
# Brightness
# ═══════════════════════════════════════════

bind=NONE,XF86MonBrightnessUp,spawn,brightness up
bind=NONE,XF86MonBrightnessDown,spawn,brightness down

# ═══════════════════════════════════════════
# Media Player Controls (pctl wrapper)
# ═══════════════════════════════════════════

bind=NONE,XF86AudioPlay,spawn,pctl play-pause
bind=SHIFT,XF86AudioPlay,spawn,pctl NEXT
bind=NONE,XF86AudioPause,spawn,pctl pause
bind=NONE,XF86AudioNext,spawn,pctl next
bind=SHIFT,XF86AudioNext,spawn,pctl position 5+
bind=NONE,XF86AudioPrev,spawn,pctl previous
bind=SHIFT,XF86AudioPrev,spawn,pctl position 5-
# keycode 164 = XF86AudioPlay on some keyboards
bind=NONE,code:164,spawn,pctl play-pause

# Mouse media buttons
mousebind=NONE,btn_extra,spawn,pctl next
mousebind=SHIFT,btn_extra,spawn,pctl position 5+
mousebind=SHIFT,btn_side,spawn,pctl position 5-

# ═══════════════════════════════════════════
# Display / Connectivity
# ═══════════════════════════════════════════

bind=SUPER+SHIFT,p,spawn_shell,timeout 30 rofi-randr
bind=SUPER+CTRL,p,spawn_shell,timeout 30 autorandr_dmenu
bind=NONE,XF86Display,spawn_shell,timeout 30 autorandr_dmenu
bind=SHIFT,XF86Display,spawn_shell,timeout 30 rofi-randr
bind=SUPER,b,spawn_shell,timeout 10 bluetooth_dmenu
bind=SUPER,i,spawn_shell,timeout 30 networkmanager_dmenu -i
bind=SUPER,u,spawn_shell,timeout 10 udiskie-dmenu

# ═══════════════════════════════════════════
# Lock
# ═══════════════════════════════════════════

bind=SUPER,l,spawn,loginctl lock-session

# ═══════════════════════════════════════════
# Keyboard Layout
# ═══════════════════════════════════════════

bind=SUPER,k,switch_keyboard_layout

# ═══════════════════════════════════════════
# Emoji (timeout 30, matching updated i3 config)
# ═══════════════════════════════════════════

bind=SUPER,period,spawn_shell,timeout 30 bemoji -t

# ═══════════════════════════════════════════
# Force-kill focused window (xkill replacement)
# ═══════════════════════════════════════════

bind[r]=SUPER,x,killclient

# ═══════════════════════════════════════════
# Clipboard (clipman + wtype for Wayland)
# ═══════════════════════════════════════════

bind=SUPER+SHIFT,v,spawn_shell,clipman pick -t rofi -T'-i' && wtype -M ctrl -M shift v -m shift -m ctrl
bind=SUPER+CTRL,v,spawn_shell,clipman pick -t rofi -T'-i' && wtype "$(wl-paste)"

# ═══════════════════════════════════════════
# Screenshots (dual-mode in screenshot script)
# ═══════════════════════════════════════════

# Selection > Clipboard
bind[r]=NONE,Print,spawn,screenshot selection clipboard
# Full Screen > Clipboard
bind[r]=SHIFT,Print,spawn,screenshot full clipboard
# Window > Clipboard
bind[r]=SUPER+SHIFT,Print,spawn,screenshot window clipboard
# Selection > File
bind[r]=CTRL,Print,spawn,screenshot selection --
# Full Screen > File
bind[r]=CTRL+SHIFT,Print,spawn,screenshot full --
# Window > File
bind[r]=CTRL+SHIFT+SUPER,Print,spawn,screenshot window --
# Screen replay toggle
bind[r]=SUPER,Print,spawn,screenshot screen-replay

# ═══════════════════════════════════════════
# Tags — View (switch to tag)
# ═══════════════════════════════════════════

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

# Navigate tags
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,Page_Down,viewtoright

# ═══════════════════════════════════════════
# Tags — Move window to tag
# ═══════════════════════════════════════════

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ═══════════════════════════════════════════
# Tags — Toggle (multi-tag view / multi-tag window)
# ═══════════════════════════════════════════

# Toggle tag visibility (view multiple tags simultaneously)
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

# Toggle tag on window (window visible on multiple tags)
bind=SUPER+SHIFT+CTRL,1,toggletag,1
bind=SUPER+SHIFT+CTRL,2,toggletag,2
bind=SUPER+SHIFT+CTRL,3,toggletag,3
bind=SUPER+SHIFT+CTRL,4,toggletag,4
bind=SUPER+SHIFT+CTRL,5,toggletag,5
bind=SUPER+SHIFT+CTRL,6,toggletag,6
bind=SUPER+SHIFT+CTRL,7,toggletag,7
bind=SUPER+SHIFT+CTRL,8,toggletag,8
bind=SUPER+SHIFT+CTRL,9,toggletag,9

# ═══════════════════════════════════════════
# Monitor / Output management
# ═══════════════════════════════════════════

# Focus monitor
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Down,focusmon,down

# Move window to monitor
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,Up,tagmon,up
bind=SUPER+CTRL+SHIFT,Down,tagmon,down

# ═══════════════════════════════════════════
# Gaps
# ═══════════════════════════════════════════

bind=SUPER+ALT,equal,incgaps,+2
bind=SUPER+ALT,minus,incgaps,-2
bind=SUPER+ALT,0,defaultgaps
bind=SUPER+ALT,g,togglegaps
