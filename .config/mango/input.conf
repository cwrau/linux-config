# MangoWC input configuration

# Keyboard
repeat_rate=25
repeat_delay=200

# XKB — us layout with de available, toggle via keybinding
xkb_rules_layout=us,de

# Trackpad
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=0
click_method=1
disable_while_typing=0
scroll_method=1

# Mouse
mouse_natural_scrolling=0
accel_profile=2
accel_speed=0.0
