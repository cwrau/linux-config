# MangoWC main config
# Modular: source individual config files

source=~/.config/mango/appearance.conf
source=~/.config/mango/input.conf
source=~/.config/mango/keybindings.conf
source=~/.config/mango/tags.conf
source=~/.config/mango/autostart.conf

# Layout defaults
default_mfact=0.55
default_nmaster=1
new_is_master=0
smartgaps=0

# Focus
focus_follows_mouse=1
warpcursor=0

# XWayland
# Enabled by default in MangoWC

# Cursor
cursor_size=24
cursor_theme=Breeze_Hacked
