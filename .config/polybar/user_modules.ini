[module/player-info]
type = custom/script
exec = /usr/share/polybar/scripts/player-mpris-tail.py --blacklist kdeconnect --icon-playing  --icon-paused  --icon-stopped  -f '%{A1:pctl previous:}  %{A}%{A1:pctl play-pause:} {icon-reversed} %{A}%{A1:pctl next:}  %{A}{:position: {position} / {duration} - :}{:artist:t30:{artist}:}{:artist: -:}{:title:t60: {title}:}'
tail = true
label = %output%

[module/current-player]
type = custom/script
exec = pctl PRINT -f
click-left = pctl NEXT
tail = true
scroll-up = pctl volume 0.05+
scroll-down = pctl volume 0.05-

[module/pulse-restart]
type = custom/text
format = 
click-left = systemctl --user restart pipewire-pulse.service pipewire.service

[module/bluetooth]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/bluetooth.sh
tail = true
click-left = /usr/local/bin/bluetooth_dmenu

[module/notifications]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/notifications.sh
tail = true

[module/agent-limit]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/agent-limit.sh
click-left = $XDG_CONFIG_HOME/bar/scripts/agent-limit.sh click
tail = true

[module/microphone]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/microphone.sh
tail = true

[module/screenshare]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/screenshare.sh
tail = true

[module/anlage]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/ha-toggle.sh anlage
click-left = kill -USR1 %pid%
tail = true

[module/ringlicht]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/ha-toggle.sh ringlicht
click-left = kill -USR1 %pid%
tail = true

[module/fernsehen]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/ha-toggle.sh fernsehen
click-left = kill -USR1 %pid%
tail = true

[module/work]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/systemd-display.sh work.target 
tail = true

[module/gamemode]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/systemd-display.sh gamemode.service  gamemode.target
tail = true

[module/messengers]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/systemd-display.sh messengers.target 
tail = true

[module/glava]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/systemd-display.sh glava.target 
tail = true

[module/systemd-status]
type = custom/script
exec = $XDG_CONFIG_HOME/bar/scripts/systemd-status.sh
tail = true
