[[plugins."agent-of-empires.cron".settings.jobs]]
agent_id = "claude"
enabled = true
group = "AOE Weekly Learnings"
id = "f2def40e-245b-47ff-9437-42c6f3212d99"
mode_id = "bypassPermissions"
model_id = "default"
name = "AOE Weekly Learnings"
project_paths = ["/home/cwr/.cache/agent-of-empires/cron-plugin/runtime"]
prompt = """
First, before anything else: run `aoe list --json --state=live` and filter to entries with group == "AOE Weekly Learnings". Get this session's own id via `basename "$AOE_ARTIFACT_DIR"` and compare created_at timestamps. If any OTHER live session in that group has a newer created_at than this one, a newer run of this exact job is already active — abort immediately and completely, do nothing else.

Read-only review. Gather and present findings only — do NOT edit ~/.claude/CLAUDE.md or any file under ~/.claude/memory/ yourself. This mirrors the manual review done on 2026-08-18, just automated and weekly.

1. Read ~/.claude/CLAUDE.md and ~/.claude/memory/MEMORY.md (and skim the memory files it indexes) so you know the current hard rules and recorded memories and don't re-suggest what's already covered.

2. Read ~/.config/agent-of-empires/weekly-learnings-log.md (create it, empty, if it doesn't exist yet — this file is the durable cross-week record, since AoE sessions themselves get trashed). If it has a previous dated entry, take its "Proposed" items (each has a short `slug` for reference) and check each one:
   - Was it actually adopted since then (does that rule/memory now genuinely exist in CLAUDE.md/memory, in some form)? If yes, look at this week's sessions (gathered in step 4) for evidence it's being followed, still causing friction, firing when it shouldn't, or being pushed back on — give it a short verdict: "adopted, working", "adopted, needs adjusting: <why + evidence>", or "adopted, no evidence either way yet".
   - If not adopted at all, re-surface it once more noting "pending since <date>", unless this week's evidence suggests it's no longer relevant (say why if so).

3. Find all AOE sessions active in the last 7 days: query the sqlite3 db at ~/.config/agent-of-empires/acp_events.db, table acp_events(session_id, seq, event_json, created_at, discriminant) — created_at is epoch-ms. Cross-reference ~/.config/agent-of-empires/workspace-ordering.json to find each session's project path. Exclude this job's own session.

4. For each session, pull the UserPromptSent events in order (event_json like {"UserPromptSent":{"text":"..."}}) plus ApprovalRequested/ApprovalResolved/PromptRejected/ConversationCompacted/AgentStartupError/PromptRuntimeError/RateLimit — this reconstructs what was asked and where there was friction, a correction, an explicit confirmation, or a new durable fact. Also specifically watch for anything relevant to last run's proposals, for the adoption-check in step 2.

5. Fan this out across parallel subagents (batch ~5-8 sessions per subagent) so it stays fast — there are usually 20-40 sessions/week.

6. Flag: corrections likely to recur (not one-off typo fixes), explicit praise/confirmation of a non-obvious approach, repeated friction or mistakes, new durable project facts/deadlines/ownership, pointers to external systems, agent/skill config bugs or capability gaps, and anything that contradicts an existing rule. Skip routine work with no correction or friction.

7. Synthesize one prioritized digest: adoption-check verdicts from step 2 first, then urgent bugs, then new CLAUDE.md rule candidates, then new memory candidates (grouped by which existing file they'd extend vs. a new file), then rule-violation reinforcement call-outs, then low-priority/skip items. Put it in the chat as your final response. Give every new proposal a short kebab-case `slug` in backticks so next week's run can reference it.

8. Append this week's digest to ~/.config/agent-of-empires/weekly-learnings-log.md as a new dated section (`## YYYY-MM-DD`, today's date). Append-only — never rewrite or delete past entries.

9. Send me a notification (see notify/ntfy skill) with a link to this session, since this runs unattended overnight and I need to come review it and decide what to actually apply.

10. Delete old "AOE Weekly Learnings" sessions in AoE to trash — the log file, not the session, is the durable record now."""
sandbox = false
schedule = "0 22 * * 6"

[[plugins."agent-of-empires.cron".settings.jobs]]
agent_id = "claude"
enabled = true
group = "Check Updates"
id = "562f75e3-f9cc-44e3-b3b2-91df7cb22a20"
mode_id = "bypassPermissions"
model_id = "default"
name = "Check Updates"
project_paths = ["/home/cwr/.cache/agent-of-empires/cron-plugin/runtime"]
prompt = """
First, before anything else: run `aoe list --json --state=live` and filter to entries with group == "Check Updates". Get this session's own id via `basename "$AOE_ARTIFACT_DIR"` and compare created_at timestamps. If any OTHER live session in that group has a newer created_at than this one, a newer run of this exact job is already active — abort immediately and completely, do nothing else.

Then, check if `systemctl --user is-active --quiet work.target` succeeds (exit code 0). If not, skip directly to the final cleanup step below (still run it) and do nothing else.

Run `aoe list --json --state=live | jq 'map(select(.group == "updates"))'` to find live sessions tagged group == "updates" -- these are long-running dependency-MR-review sessions (one per repo, running the `dependency-mr-review` skill) that watch their repo's renovate/dependabot MRs but don't proactively notice brand-new ones appearing later. For each session found, ping it via `aoe send <id> "<message>"` asking it to re-run discovery for any newly-opened dependency-update MRs/PRs in its repo that aren't already being tracked, and handle them through the skill's usual triage-then-confirm workflow -- no action needed if nothing new turned up. If none are found, that's fine, just note it, there's nothing to ping.

Report to chat which sessions (titles) got pinged, or that none were found.

Always delete all the old Check Updates sessions in AoE to trash as the final step -- even if you skipped everything else above due to the work.target check. (Exception: the session-duplicate check at the very top -- if THAT one aborts, do nothing at all, a newer instance already owns cleanup.)"""
sandbox = false
schedule = "0 10 * * *"

