[[plugins."agent-of-empires.cron".settings.jobs]]
agent_id = "claude"
enabled = true
group = "Date Night"
id = "5d847572-ea31-49e4-99e6-9de7f0ceccef"
mode_id = "bypassPermissions"
model_id = "default"
name = "Date Night"
project_paths = ["/home/cwr/projects/dates"]
prompt = """
Zuerst, vor allem anderen: Führe `aoe list --json --state=live` aus und filtere auf Einträge mit group == "Date Night". Ermittle die eigene Session-ID via `basename "$AOE_ARTIFACT_DIR"` und vergleiche die created_at-Zeitstempel. Falls eine ANDERE live Session dieser Gruppe ein neueres created_at hat als diese eigene Session, läuft bereits eine neuere Instanz dieses Jobs — brich sofort und komplett ab, tue nichts weiter (keine Recherche, keine Benachrichtigung, kein Löschen alter Sessions).

Checke ob heute der 2. Freitag im graden Monat ist. Falls nicht, überspringe direkt zum letzten Schritt unten (Löschen alter Sessions — der läuft immer, auch bei diesem frühen Abbruch) und tue sonst nichts.

Schaue die existierenden Ideen an und recherchiere aber auch immer nach neuen Möglichkeiten, vor allen auch aktuelle Dinge. Die Date Night findet diesen Monat am 4. Freitag statt.

Schicke mir dann 4 Ideen via pushbullet (siehe notify (ntfy) skill) — nicht mehr, das Tool für die Auswahl danach unterstützt maximal 4 Optionen. Mindestens 3 davon sollten garantiert kostenlos sein und bei den die Geld kosten schreibe die garantierten kosten plus eine Schätzung dazu, also beispielsweise 30€ fix für Tickets und geschätzte 30€ für trinken zusätzlich.

Falls möglich sollte auch immer ein link dabei sein, und wenn es nur ein Google Maps link zur location ist.

Stelle mir danach im Chat die tool Frage welche der 4 Möglichkeiten ich will (richtiger tool call, maximal 4 Optionen). Speichere jedes Feedback, was wir mögen und was nicht,... in die CLAUDE.md und beachte diese immer.

Lösche IMMER als letzten Schritt alle alten Date Night sessions in AoE in den trash — auch wenn du oben wegen des Datums-Checks früh abgebrochen bist. (Ausnahme: der Session-Duplikat-Check ganz oben, falls DER abbricht, dann wirklich nichts tun — eine neuere Instanz kümmert sich darum.)"""
sandbox = false
schedule = "0 10 * * 5"

